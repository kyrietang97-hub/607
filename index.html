/* ============ 音效系统（Web Audio 合成，无外部资源） ============ */
let audioCtx = null, soundEnabled = true;

/* ============ 设置 ============ */
let textSpeed = 1; // 0.5 慢 / 1 正常 / 2 快
let skipStory = false;
try {
  textSpeed = parseFloat(localStorage.getItem("dorm607_textSpeed") || "1") || 1;
  skipStory = localStorage.getItem("dorm607_skipStory") === "1";
} catch(e){}

    localStorage.setItem("dorm607_textSpeed", String(textSpeed));

  } catch(e){}
}
function storyInterval(base) {
  if (skipStory) return 0;
  return Math.max(80, Math.floor((base || 800) / textSpeed));
}

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type, vol, slide) {
  if (!soundEnabled) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slide), ctx.currentTime + dur);
  gain.gain.setValueAtTime(vol || 0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur + 0.02);
}
function sfx(name) {
  if (!soundEnabled) return;
  switch(name) {
    case "click": playTone(420, 0.05, "triangle", 0.04); break;
    case "dmg": playTone(180, 0.12, "sawtooth", 0.06, 80); break;
    case "crit": playTone(520, 0.08, "square", 0.07); setTimeout(()=>playTone(780, 0.1, "square", 0.05), 60); break;
    case "heal": playTone(440, 0.15, "sine", 0.05, 660); break;
    case "block": playTone(280, 0.1, "triangle", 0.05); break;
    case "win": playTone(330, 0.12, "sine", 0.05); setTimeout(()=>playTone(440, 0.15, "sine", 0.05), 100); setTimeout(()=>playTone(550, 0.2, "sine", 0.04), 220); break;
    case "lose": playTone(200, 0.3, "sawtooth", 0.05, 60); break;
    case "skill": playTone(360, 0.06, "triangle", 0.04); break;
    case "lowhp": playTone(120, 0.25, "sine", 0.03); break;
  }
}

const GARBLE_CHARS = ["□","▓","█","░","▒","■","▣","▤","▥"];
const PRESERVE_CHARS = ["你","我","他","她","门","镜","鬼","走","看","听","死","血","手","脚","声","影","黑","白","冷","热","笑","哭","回","头","口","眼","嘴","脸","夜","楼","梯","窗","灯","理","智","疯","怕"];
function maybeShowGarbleHint() {

function garbleText(str) {
  if (!str) return str;
  const s = S.hp;
  let ratio = 0;
  if (s <= 10) ratio = 0.28;
  else if (s <= 20) ratio = 0.18;
  else if (s <= 30) ratio = 0.10;
  else if (s <= 50) ratio = 0.05;
  else return str;
  maybeShowGarbleHint();
  let out = "";
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (/[\s\n，。！？、；：""''《》（）—…·]/.test(ch)) { out += ch; continue; }
    if (PRESERVE_CHARS.includes(ch)) { out += ch; continue; }
    if (Math.random() < ratio) out += GARBLE_CHARS[Math.floor(Math.random()*GARBLE_CHARS.length)];
    else out += ch;
  }
  return out;
}

/** 逐段剧情：自动推进；点击任意处可立刻下一段 */
function playStoryLines(lines, onDone, opts) {
  opts = opts || {};
  const baseInterval = opts.interval || 800;
  const btnLabel = opts.btnLabel || null;
  // 跳过全部旁白
  if (skipStory && !opts.forceShow) {
    if (btnLabel) {
      content.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.style.cssText = "padding:60px 24px;display:flex;flex-direction:column;justify-content:center;min-height:60vh;";
      content.appendChild(wrap);
      const btn = document.createElement("button");
      btn.className = "btn primary"; btn.textContent = btnLabel;
      btn.onclick = () => onDone && onDone();
      wrap.appendChild(btn);
    } else {
      onDone && onDone();
    }
    return;
  }
  const interval = storyInterval(baseInterval);
  content.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.style.cssText = "padding:60px 24px 40px;display:flex;flex-direction:column;justify-content:center;min-height:100%;cursor:pointer;";
  content.appendChild(wrap);
  const hint = document.createElement("div");
  hint.style.cssText = "text-align:center;color:#3a3a44;font-size:11px;margin-bottom:16px;letter-spacing:2px;";
  hint.textContent = "点击继续 · 可跳过";
  wrap.appendChild(hint);
  let i = 0;
  let timer = null;
  let finished = false;
  const clearT = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const finish = () => {
    if (finished) return;
    finished = true;
    clearT();
    wrap.style.cursor = "default";
    wrap.onclick = null;
    hint.remove();
    if (btnLabel) {
      const btn = document.createElement("button");
      btn.className = "btn primary"; btn.style.marginTop = "32px"; btn.textContent = btnLabel;
      btn.onclick = (e) => { e.stopPropagation(); onDone && onDone(); };
      wrap.appendChild(btn);
    } else {
      onDone && onDone();
    }
  };
  const showNext = () => {
    if (finished) return;
    if (i >= lines.length) { finish(); return; }
    clearT();
    const item = lines[i++];
    const text = typeof item === "string" ? item : item.text;
    const cls = typeof item === "string" ? (opts.cls || sanityClass()) : (item.cls || sanityClass());
    const p = document.createElement("div");
    p.className = cls;
    p.textContent = garbleText(text);
    wrap.appendChild(p);
    requestAnimationFrame(() => p.classList.add("show"));
    content.scrollTop = content.scrollHeight;
    if (i >= lines.length) {
      timer = setTimeout(finish, Math.min(interval || 200, 400));
    } else {
      timer = setTimeout(showNext, interval || 50);
    }
  };
  wrap.onclick = () => {
    if (finished) return;
    if (i >= lines.length) { finish(); return; }
    showNext();
  };
  showNext();
}

function sanityClass() {
  if (S.hp <= 20) return "story-text flash";
  if (S.hp <= 30) return "story-text repeat";
  if (S.hp <= 50) return "story-text dim";
  return "story-text";
}

function skillById(id) { return SKILLS.find(s=>s.id===id); }
function cloneSkill(s, enhance) {
  if (!s) return null;
  const c = { ...s, enhance: enhance != null ? enhance : (s.enhance || 0) };
  return c;
}
function ownedSkillIds() {
  return S.skills.filter(Boolean).map(s => s.id);
}
function findOwnedSkill(id) {
  return S.skills.find(s => s && s.id === id);
}
function canEnhanceSkill(s) {
  return s && s.rarity === "common" && (s.enhance || 0) < 5;
}
function isMaxEnhanced(s) {
  return s && s.rarity === "common" && (s.enhance || 0) >= 5;
}
function enhanceSkillInPlace(id) {
  for (let i = 0; i < S.skills.length; i++) {
    if (S.skills[i] && S.skills[i].id === id && canEnhanceSkill(S.skills[i])) {
      S.skills[i] = cloneSkill(S.skills[i], (S.skills[i].enhance || 0) + 1);
      return S.skills[i];
    }
  }
  return null;
}
function getAvailableSkills() {
  const owned = new Set(ownedSkillIds());
  return SKILLS.filter(s => {
    if ((s.req || 0) > S.inspiration) return false;
    if (owned.has(s.id)) {
      // 已拥有：满级普通不再出现；未满级普通不作为「新技能」出现
      return false;
    }
    return true;
  });
}

/* ============ 经验值 ============ */
function expNeeded(lv) { return 12 + lv * 8; } // Lv1→2:20, 2→3:28, 3→4:36...
function getKillExp(kind, floor, ghost) {
  // 基础经验随楼层略升（越往下越难，经验略多）
  const depth = 7 - floor; // 6楼=1, 1楼=6
  if (kind === "normal") {
    // 不同普通怪略有差异：按 hp 微调
    const base = 8 + depth * 2;
    const bonus = ghost && ghost.hp ? Math.floor(ghost.hp / 20) : 0;
    return base + bonus;
  }
  if (kind === "elite") return 18 + depth * 3;
  if (kind === "hidden") return 32 + depth * 4;
  if (kind === "boss") return 45 + depth * 5;
  if (kind === "shopkeeper") return 50;
  return 10;
}
function gainExp(amount) {
  if (amount <= 0) return;
  S.exp += amount;
  let leveled = 0;
  while (S.exp >= S.expToNext) {
    S.exp -= S.expToNext;
    S.level++;
    S.expToNext = expNeeded(S.level);
    leveled++;
    S.pendingLevelUps++;
  }
  updateTopbar();
  if (leveled > 0) {
    toast(`等级提升！Lv.${S.level - leveled} → Lv.${S.level}`);
    sfx("win");
  } else {
    toast(`+${amount} 经验`);
  }
}

/* ============ DOM 与工具 ============ */
const $ = id => document.getElementById(id);
const content = $("content"), actionbar = $("actionbar"), topbar = $("topbar");
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._tid); t._tid = setTimeout(()=>t.classList.remove("show"), 1500); }
function rnd(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr) { const a = [...arr]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randomSkill() { return rnd(getAvailableSkills()); }
function randomEquip() { return rnd(EQUIPS.filter(e=>!e.exclusive)); }
function hasEquip(id) { return S.equips.some(e=>e.id===id); }
function hasTalent(id) { return S.talents.some(t=>t.id===id); }

/* ============ 天赋抽取（品质概率：普通60% 高级32% 传说8%） ============ */
function pickRandomTalents() {
  const common = shuffle(TALENTS.filter(t => t.quality === "common"));
  const rare = shuffle(TALENTS.filter(t => t.quality === "rare"));
  const legend = shuffle(TALENTS.filter(t => t.quality === "legend"));
  const picks = [];
  while (picks.length < 8) {
    const r = Math.random();
    let pick;
    if (r < 0.60 && common.length) pick = common.shift();
    else if (r < 0.92 && rare.length) pick = rare.shift();
    else if (legend.length) pick = legend.shift();
    else if (common.length) pick = common.shift();
    else if (rare.length) pick = rare.shift();
    if (pick) picks.push(pick); else break;
  }
  while (picks.length < 8) {
    const remaining = TALENTS.filter(t => !picks.includes(t));
    if (!remaining.length) break;
    picks.push(rnd(remaining));
  }
  return picks.slice(0, 6);
}

function showAd(cb, d) { d = d || 3; const o = $("ad-overlay"), c = $("ad-count"); o.classList.add("show"); let l = d; c.textContent = l; const t = setInterval(() => { l--; c.textContent = l; if (l <= 0) { clearInterval(t); o.classList.remove("show"); cb(); } }, 1000); }
function floatText(text, color, isCrit) { const el = document.createElement("div"); el.className = "float-text " + (color || "normal") + (isCrit ? " crit" : ""); el.textContent = text; el.style.left = (Math.random()*40+30)+"%"; el.style.top = (Math.random()*20+35)+"%"; document.body.appendChild(el); setTimeout(() => el.remove(), 800); }
function screenShake() { const a = $("app"); a.classList.add("shake"); setTimeout(() => a.classList.remove("shake"), 300); }
function critFlash() { const e = $("crit-flash"); e.classList.add("active"); setTimeout(() => e.classList.remove("active"), 300); sfx("crit"); }

function addEquip(e) {
  if (S.equips.length >= MAX_EQUIPS) { showReplaceEquip(e); return false; }
  S.equips.push(e);
  if (e.id === "stone_heart") { S.maxHP += 20; S.hp += 20; }
  if (e.id === "mirror") gainInspiration(1);
  updateTopbar();
  return true;
}
function addSkillToSlot(s) {
  const emptyIdx = S.skills.indexOf(null);
  const inst = cloneSkill(s, s.enhance || 0);
  if (emptyIdx >= 0) { S.skills[emptyIdx] = inst; return; }
  const worstIdx = S.skills.findIndex(x => x && x.rarity === "common");
  if (worstIdx >= 0) S.skills[worstIdx] = inst;
  else {
    // 没有普通可替时不强制覆盖
  }
}
function updateTopbar() {
  if (S.battle) {
    $("ghost-hp-wrap").style.display = "";
    $("ghost-hp-row").style.display = "";
    const pct = Math.max(0, Math.min(100, (S.battle.ghostHP / Math.max(1, S.battle.ghostMaxHP)) * 100));
    $("ghost-hp-bar").style.width = pct + "%";
    $("ghost-hp-text").textContent = Math.max(0, Math.floor(S.battle.ghostHP)) + "/" + S.battle.ghostMaxHP;
  } else {
    $("ghost-hp-wrap").style.display = "none";
    $("ghost-hp-row").style.display = "none";
  }
  $("floor-label").textContent = S.floor + "楼";
  $("step-label").textContent = S.step < 3 ? "第" + (S.step+1) + "步" : "尽头";
  const lvEl = $("lv-label");
  if (lvEl) lvEl.textContent = "Lv." + S.level;
  const pathEl = $("path-label");
  if (pathEl) {
    if (S.path && PATHS[S.path]) {
      pathEl.style.display = "";
      pathEl.className = "path-tag " + S.path;
      pathEl.textContent = PATHS[S.path].name;
    } else { pathEl.style.display = "none"; }
  }
  const inspEl = $("insp-label");
  if (inspEl) inspEl.textContent = S.inspiration;
  const paperEl = $("paper-label");
  if (paperEl) paperEl.textContent = S.paper;
  $("hp-bar").style.width = Math.max(0, S.hp / S.maxHP * 100) + "%";
  $("hp-text").textContent = Math.max(0, Math.floor(S.hp)) + "/" + S.maxHP;
  if (S.hp <= 50) maybeShowGarbleHint();
  const expEl = $("exp-text");
  if (expEl) expEl.textContent = S.exp + "/" + S.expToNext;
  const expBar = $("exp-bar");
  if (expBar) expBar.style.width = Math.min(100, (S.exp / Math.max(1, S.expToNext)) * 100) + "%";
  const badges = $("badges");
  badges.innerHTML = "";
  S.equips.forEach(e => { const span = document.createElement("span"); span.className = "badge equip"; span.textContent = e.name; badges.appendChild(span); });
  S.talents.forEach(t => { const span = document.createElement("span"); span.className = "badge talent"; span.textContent = t.name; badges.appendChild(span); });
  S.bossSpecials.forEach(id => {
    const sp = Object.values(BOSS_SPECIALS).find(x => x.id === id);
    if (sp) { const span = document.createElement("span"); span.className = "badge equip"; span.style.borderColor = "#5a2020"; span.style.color = "#c8a0a0"; span.textContent = sp.name; badges.appendChild(span); }
  });
  // Low sanity vignette
  const vig = $("vignette");
  if (vig) {
    if (S.hp <= 30) vig.classList.add("active");
    else vig.classList.remove("active");
  }
}
function gainInspiration(n) {
  const before = S.inspiration;
  S.inspiration += n;
  updateTopbar();
  // Narrative milestones – make the resource feel like “seeing more”
  if (before < 1 && S.inspiration >= 1) toast("你开始听见楼里细小的声音。");
  else if (before < 3 && S.inspiration >= 3) toast("你能看清它们打算做什么了。");
  else if (before < 5 && S.inspiration >= 5) toast("暗处有东西。只有你看得到。");
  else if (before < 7 && S.inspiration >= 7) toast("整栋楼对你几乎没有秘密了。");
}
function getGhostReveal() {
  const i = S.inspiration;
  let r;
  if (i >= 5) r = { intent:true, skills:true, weakness:true };
  else if (i >= 3) r = { intent:true, skills:true, weakness:false };
  else if (i >= 1) r = { intent:true, skills:false, weakness:false };
  else r = { intent:false, skills:false, weakness:false };
  if (hasPathPassive(6) && S.path === "tongling") r.intent = true;
  if (S.battle && S.battle._forceIntent) r.intent = true;
  if (S.battle && S.battle._fullReveal) { r.intent = true; r.skills = true; r.weakness = true; }
  return r;
}
function getCritRate() {
  let base = 0;
  const i = S.inspiration;
  if (i >= 6) base = 0.30;
  else if (i >= 4) base = 0.20;
  else if (i >= 2) base = 0.10;
  if (hasEquip("cat_eye")) base += 0.10;
  if (hasPathPassive(6) && S.path === "powang") base += 0.10;
  return Math.min(base, 0.50);
}

  S.phase = "safeRoom"; topbar.style.display = "none";
  const intro = SAFE_ROOM_INTRO[S.floor] || "你找到一个安全的地方。\n坐下来。";
  content.innerHTML = `<div class="safe-room"><div class="title">安 全 屋</div><div class="text">${garbleText(intro)}</div></div><div class="btn-row" id="safe-choices"></div>`;
  const box = $("safe-choices");
  const heal = Math.floor(S.maxHP * 0.32);
  const c1 = document.createElement("button");
  c1.className = "btn"; c1.textContent = `休息（恢复 ${heal} 理智）`;
  c1.onclick = () => { S.hp = Math.min(S.maxHP, S.hp + heal); updateTopbar(); content.innerHTML = `<div class="safe-room"><div class="text" style="color:#8a6aaa;">你休息了一会儿。\n你感觉好多了。</div></div>`; actionbar.innerHTML = ""; const b = document.createElement("button"); b.className = "btn primary"; b.textContent = "离 开 安 全 屋"; b.onclick = callback; actionbar.appendChild(b); };

/* ============ 地图 ============ */
function nodePoolForStep(step) {
  if (step === 0) return ["battle","battle","event","treasure"];
  if (step === 1) return ["battle","elite","event","rest","treasure","shop"];
  if (step === 2) return ["battle","elite","event","rest","treasure","shop"];
  return ["boss"];
}
function generateMapOptions() {
  // 每层最后一步：强制 BOSS，不掺其他节点
  if (S.step >= S.maxStep) {
    S.mapOptions = ["boss"];
    S.mapKey = S.floor + "_" + S.step;
    return;
  }
  let pool = nodePoolForStep(S.step);
  if (S.shopGone) pool = pool.filter(p => p !== "shop");
  const uniq = [...new Set(pool)];
  const picks = [];
  while (picks.length < 3 && uniq.length) { const p = uniq.splice(Math.floor(Math.random()*uniq.length),1)[0]; picks.push(p); }
  while (picks.length < 3) picks.push("battle");
  if (S.inspiration >= 5 && Math.random() < (S.inspiration >= 6 ? 0.7 : 0.4)) picks.push("hidden");
  S.mapOptions = picks;
  S.mapKey = S.floor + "_" + S.step;
}
/** 仅在楼层/步数变化时重新生成；从子页面返回不刷新 */
function ensureMapOptions() {
  const key = S.floor + "_" + S.step;
  if (S.mapKey === key && S.mapOptions && S.mapOptions.length) return;
  generateMapOptions();
}
function getNodeInfo(type) {
  if (type === "battle") return { icon:"⚔", name:"战斗", desc:"走廊里有东西在等", cls:"normal" };
  if (type === "elite") return { icon:"👹", name:"精英", desc:"它比普通的更清醒", cls:"elite" };
  if (type === "event") return { icon:"❓", name:"事件", desc:"你不知道前面是什么" };
  if (type === "rest") return { icon:"🔥", name:"休息", desc:"有人留了灯，暂时安全" };
  if (type === "treasure") return { icon:"💎", name:"宝箱", desc:"前人留下的东西" };
  if (type === "hidden") return { icon:"🌑", name:"暗处", desc:"灵感让你看见了别人看不见的", cls:"hidden" };
  if (type === "shop") {
    if (S.shopGone) return { icon:"🚪", name:"空铺", desc:"店主走了，铺子也空了", cls:"empty", disabled:true };
    if (S.refusedPaper) return { icon:"👺", name:"纸钱铺 · 挑战", desc:"它记得你拒绝过", cls:"shop-challenge" };
    return { icon:"🏮", name:"纸钱铺", desc:"死人的货币，换活人的东西", cls:"shop" };
  }
  if (type === "boss") {
    if (S.floor === 1) return { icon:"🚪", name:"出口", desc:"门外有光。门前有东西。没有退路。", cls:"elite" };
    return { icon:"🚪", name:"尽头", desc:"这层楼的尽头。必须过去。", cls:"elite" };
  }
  return { icon:"?", name:"未知", desc:"" };
}
function renderMap() {
  S.phase = "map"; topbar.style.display = ""; updateTopbar(); ensureMapOptions();
  const title = S.step < 3 ? `第 ${S.step+1} 步` : "尽头";
  let dots = "";
  for (let i = 0; i < 4; i++) {
    const cls = i < S.step ? "done" : (i === S.step ? "now" : "");
    const boss = i === 3 ? " boss" : "";
    dots += `<div class="map-dot ${cls}${boss}"></div>`;
  }
  const pathLine = S.path && PATHS[S.path] ? `<div class="map-sub" style="margin-bottom:8px;color:${PATHS[S.path].color};">${PATHS[S.path].name}之路</div>` : "";
  content.innerHTML = `<div class="map-title">${S.floor}楼 · ${FLOOR_NAMES[S.floor]}</div>${pathLine}<div class="map-progress">${dots}</div><div class="map-sub">${title} · 选择你的道路</div><div class="node-list" id="node-list"></div>`;
  const list = $("node-list");
  S.mapOptions.forEach(type => {
    const info = getNodeInfo(type);
    const card = document.createElement("div");
    card.className = "node-card" + (info.cls ? " " + info.cls : "") + (info.disabled ? " disabled" : "");
    card.innerHTML = `<div class="node-icon">${info.icon}</div><div class="node-info"><div class="name">${info.name}</div><div class="desc">${info.desc}</div></div>`;
    if (!info.disabled) card.onclick = () => enterNode(type);
    list.appendChild(card);
  });
  // 尽头强制 BOSS：文案提示
  if (S.step >= S.maxStep) {
    const hint = document.createElement("div");
    hint.className = "map-sub";
    hint.style.marginTop = "12px";
    hint.textContent = S.floor === 1 ? "没有别的路了。出去，或者留下。" : "这是本层唯一的路。退不回去。";
    list.parentNode.appendChild(hint);
  }
  actionbar.innerHTML = "";
  const btn1 = document.createElement("button"); btn1.className = "btn ghost"; btn1.textContent = "技能栏"; btn1.onclick = () => { sfx("click"); showSkills(); }; actionbar.appendChild(btn1);
  const btn2 = document.createElement("button"); btn2.className = "btn ghost"; btn2.textContent = "装备栏"; btn2.onclick = () => { sfx("click"); showEquips(); }; actionbar.appendChild(btn2);
  // 特殊跳关：仅持有「骨钥匙」且非 1 楼出口时，可付代价走侧门（仍有失败风险）
  if (S.step >= S.maxStep && S.floor !== 1 && hasEquip("bone_key") && !S.sideDoorUsed) {
    const btnSkip = document.createElement("button");
    btnSkip.className = "btn ghost";
    btnSkip.style.color = "#9a6ac8";

    btnSkip.onclick = () => tryBossSideDoor();
    actionbar.appendChild(btnSkip);
  }
  const btnAbandon = document.createElement("button"); btnAbandon.className = "btn ghost"; btnAbandon.textContent = "放弃本局"; btnAbandon.style.color = "#5a3a3a";
  btnAbandon.onclick = () => {
    if (confirm("确定放弃本局？进度将丢失。")) {
      clearRun();
      sfx("lose");
      titleScreen();
    }
  };
  actionbar.appendChild(btnAbandon);
  saveRun();
}

function scaleGhostStats(ghost, kind) {
  // 略降倍率：携带位增加后仍需装备，但不至于被数值压垮
  const floorM = {6:1.10, 5:1.18, 4:1.26, 3:1.34, 2:1.42, 1:1.52};
  const kindM = {normal:1.0, elite:1.08, boss:1.15, hidden:1.10, shopkeeper:1.12};
  const m = (floorM[S.floor] || 1.3) * (kindM[kind] || 1);
  const g = { ...ghost };
  g.hp = Math.max(1, Math.floor(g.hp * m));
  g.dmg = Math.max(1, Math.floor((g.dmg || 3) * m));
  if (g.skills) {
    g.skills = g.skills.map(s => {
      const ns = { ...s };
      if (ns.dmg) ns.dmg = Math.max(1, Math.floor(ns.dmg * m));
      if (ns.block) ns.block = Math.max(1, Math.floor(ns.block * m));
      return ns;

  }

}

/* ============ 流程 ============ */
function nextStep() {
  S.step++;
  S.mapKey = null;
  S.mapOptions = [];
  if (S.step > S.maxStep) {
    const idx = FLOOR_ORDER.indexOf(S.floor);
    if (idx >= FLOOR_ORDER.length - 1) { showEnd(true); return; }
    showSafeRoom(() => {
      const nextFloor = FLOOR_ORDER[idx + 1];
      showFloorTransition(nextFloor, () => {
        S.floor = nextFloor; S.step = 0; S.mapKey = null; S.mapOptions = []; S.sideDoorUsed = false; gainInspiration(1);
        updateTopbar();
        const introText = FLOOR_INTRO[S.floor];
        if (introText) { showFloorIntro(introText, () => renderMap()); return; }
        renderMap();
      });
    });
    return;
  }
  if (!S.paperDropShown && S.floor === 6 && S.step === 1) { S.paperDropShown = true; showPaperDrop(); return; }
  if (S.step > 0 && S.step <= S.maxStep) {
    showMapBridge(() => renderMap());
    return;
  }
  renderMap();
}

function showTalentSelect() {

  content.innerHTML = `<div class="map-title" style="margin-bottom:6px;">选择天赋</div><div class="map-sub">选 ${MAX_TALENTS} 个</div><div class="reward-list" id="talent-list"></div>`;
  const list = $("talent-list");

    list.innerHTML = "";

      const d = document.createElement("div");
      d.className = "reward-card rarity-" + (t.quality === "common" ? "common" : t.quality === "rare" ? "rare" : "legend");

/* ============ 开局（固定 2 技能 + 3 天赋） ============ */
function startRun(picked) {
  if (picked && picked.length) S.talents = picked.slice();
  S.floor = 6; S.step = 0;
  S.hp = 100; S.maxHP = 100;
  S.inspiration = 0; S.paper = 0;
  S.equips = []; S.battle = null;
  S.immortalUsed = false;
  S.adReviveFloor = -1; S.adRerollFloor = -1; S.adShopFloor = -1; S.adTalentUsed = false;
  S.refusedPaper = false; S.paperDropShown = false; S.shopGone = false;
  S.startTime = Date.now(); S.kills = 0;
  S.noSkillUsed = true; S.immortalTriggered = false;
  S.level = 1; S.exp = 0; S.expToNext = expNeeded(1);
  S.bossPity = 0; S.bossSpecials = []; S.pendingLevelUps = 0; S.pathPassives = []; S.pathKillInspUsed = false; S.sideDoorUsed = false; S.mapKey = null; S.mapOptions = []; S.firstBattleDone = false; S.garbleHintShown = false;
  S.skills = [cloneSkill(SKILLS.find(s => s.id === "punch"), 0), cloneSkill(SKILLS.find(s => s.id === "block"), 0), null, null, null];
  if (hasTalent("t_insight")) gainInspiration(3);
  if (hasTalent("t_pocket")) { S.paper += 25; }
  if (hasTalent("t_steady")) { S.maxHP += 12; S.hp = S.maxHP; }
  if (hasTalent("t_thick")) { S.maxHP += 8; S.hp = S.maxHP; }
  if (hasTalent("t_memo")) gainInspiration(1);
  META.runs++; saveMeta(META);
  showPrologue();
}
function continueRun() {
  const run = loadRun(); if (!run) return;
  S.floor = run.floor; S.step = run.step;
  S.hp = run.hp; S.maxHP = run.maxHP;
  S.inspiration = run.inspiration; S.paper = run.paper;
  S.skills = run.skills.map((entry, i) => {
    if (!entry) return null;
    if (typeof entry === 'string') return cloneSkill(skillById(entry), 0);
    return cloneSkill(skillById(entry.id), entry.enhance || 0);
  });
  S.equips = run.equips.map(id => EQUIPS.find(e => e.id === id)).filter(Boolean);
  S.talents = (run.talents || []).map(id => TALENTS.find(t => t.id === id)).filter(Boolean);
  S.refusedPaper = run.refusedPaper || false;
  S.shopGone = run.shopGone || false;
  S.startTime = run.startTime || Date.now();
  S.kills = run.kills || 0;
  S.noSkillUsed = run.noSkillUsed !== undefined ? run.noSkillUsed : true;
  S.immortalTriggered = run.immortalTriggered || false;
  S.level = run.level || 1;
  S.exp = run.exp || 0;
  S.expToNext = run.expToNext || expNeeded(S.level);
  S.bossPity = run.bossPity || 0;
  S.bossSpecials = run.bossSpecials || [];
  S.pendingLevelUps = run.pendingLevelUps || 0;
  S.path = run.path || null;
  S.pathPassives = run.pathPassives || [];
  S.pathKillInspUsed = false;
  S.sideDoorUsed = run.sideDoorUsed || false;
  S.mapKey = null; S.mapOptions = [];
  S.firstBattleDone = run.firstBattleDone || false;
  S.garbleHintShown = run.garbleHintShown || false;
  S.immortalUsed = false;
  S.adReviveFloor = -1; S.adRerollFloor = -1; S.adShopFloor = -1; S.adTalentUsed = true;
  S.battle = null; S.paperDropShown = true;
  renderMap();
}

    d.className = "reward-card rarity-" + (t.quality === "common" ? "common" : t.quality === "rare" ? "rare" : "legend");
    const qn = {common:"普通", rare:"高级", legend:"传说"}[t.quality];
    d.innerHTML = `<div class="name">${t.name} <span style="color:#6a6a78;font-size:11px;">${qn}</span></div>
      <div class="desc">${t.desc}</div>
      <div class="flavor">${t.flavor.replace(/\n/g,"<br>")}</div>`;
    list.appendChild(d);
  });
  actionbar.innerHTML = "";
  const back = document.createElement("button"); back.className = "btn primary"; back.textContent = "返回"; back.onclick = titleScreen; actionbar.appendChild(back);
}

/* ============ 键盘支持 ============ */
document.addEventListener("keydown", e => {
  if (S.phase === "battle" && S.battle && S.battle.phase === "player") {
    if (e.key >= "1" && e.key <= "5") {
      const idx = parseInt(e.key, 10) - 1;
      if (S.skills[idx]) useSkill(idx);
      e.preventDefault();
    } else if (e.key === " " || e.key === "Enter") {
      endPlayerTurn();
      e.preventDefault();
    }
  }
  if (e.key === "Escape") {
    if (S.phase === "skills" || S.phase === "equips" || S.phase === "help") {
      if (S.phase === "help") titleScreen();
      else renderMap();
    }
  }
});

/* 首次交互解锁音频上下文（移动端需要） */
document.body.addEventListener("touchstart", () => ensureAudio(), { once: true });
document.body.addEventListener("click", () => ensureAudio(), { once: true });

titleScreen();
window.__dorm607Started = true;

})();
</script>
